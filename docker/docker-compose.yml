services:
  nginx:
    image: nginx:stable
    container_name: nginx-selinux
    ports:
      - "8080:80"
    volumes:
      # :z = shared relabel, :Z = private relabel (needed on SELinux hosts)
      - ../html:/usr/share/nginx/html:ro,z
      - ../config/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro,z
    restart: unless-stopped
